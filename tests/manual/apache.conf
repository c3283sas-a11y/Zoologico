ServerRoot "C:/xampp/apache"
Listen 127.0.0.1:8081
ServerName localhost
PidFile "C:/xampp/htdocs/ZoologicoPortafolio/tests/manual/apache.pid"
ErrorLog "C:/xampp/htdocs/ZoologicoPortafolio/tests/manual/apache.log"
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule alias_module modules/mod_alias.so
LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libpq.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPINIDir "C:/xampp/php"
<FilesMatch "\.php$">
 SetHandler application/x-httpd-php
</FilesMatch>
DocumentRoot "C:/xampp/htdocs/ZoologicoPortafolio/public"
Alias /ZoologicoPortafolio "C:/xampp/htdocs/ZoologicoPortafolio"
<Directory "C:/xampp/htdocs/ZoologicoPortafolio">
 AllowOverride All
 Require all granted
</Directory>
